[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mm_transfer"
version = "1.0.0"
dependencies = ["omegaconf", "matplotlib", "tensorboard", "sentence_transformers"]
requires-python = ">=3.12"
authors = [
  {name = "Will Solow", email = "soloww@oregonstate.edu"},
]
maintainers = [
  {name = "Will Solow", email = "soloww@oregonstate.edu"}
]
description = "Multi-Modal Transfer for Cold Hardiness Demos"
readme = "README.md"
license = {file = "LICENSE.md"}
keywords = ["model calibration", "engine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]


